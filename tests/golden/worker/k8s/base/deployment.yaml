# Generated by Gojira. Sizing comes from the 'worker' workload class —
# override in gojira.yaml with a justification, not here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clips-worker
  labels:
    app.kubernetes.io/name: clips-worker
    gojira.dev/managed: "true"
    gojira.dev/class: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clips-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clips-worker
        gojira.dev/managed: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: app
          image: gojira-app
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 4Gi
            limits:
              cpu: 1
              memory: 1Gi
              ephemeral-storage: 8Gi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
