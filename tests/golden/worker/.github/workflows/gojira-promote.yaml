# Generated by Gojira. Edits will be overwritten on regeneration —
# change gojira.yaml instead.
#
# Flow: push a v* tag → each downstream env is promoted in order. Build-from-
# scratch envs (e.g. qa) build and push their own image; the final env (prod)
# crane-copies the exact image its predecessor built and tested — no rebuild —
# then deploys. Prod waits on the "production" GitHub environment's protection
# rule (required reviewers) — approve in the Actions run.
name: Gojira Promote

on:
  push:
    tags: ['v*']

concurrency:
  group: gojira-deploy-${{ github.repository }}-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GOJIRA_CONTRACT: 477375e057249b7b6f8f96351f9cd03823f006a9b081c7509ce25c11c79cfaa7

jobs:
  deploy-qa:
    runs-on: ubuntu-latest
    env:
      IMAGE: us-central1-docker.pkg.dev/example-project/apps/clips-worker
    steps:
      - uses: actions/checkout@v4

      - name: Verify manifests match gojira.yaml
        # gojira.yaml and the manifests it implies can land in two commits
        # (a contract push, then Gojira's setup PR). Deploying the first
        # one ships a new image against stale manifests (finding #20:
        # clio's slack transport with no slack secret, ten minutes of
        # crashloop). GOJIRA_CONTRACT is the fingerprint of the contract
        # these manifests were rendered from — same canonical hash as
        # gojira.generator.contract_fingerprint. Fail here, before a build.
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install -q pyyaml
          actual=$(python3 -c 'import hashlib, json, yaml; doc = yaml.safe_load(open("gojira.yaml")); print(hashlib.sha256(json.dumps(doc, sort_keys=True, separators=(",", ":"), default=str).encode()).hexdigest())')
          if [ "$actual" != "$GOJIRA_CONTRACT" ]; then
            echo "::error::k8s/ and workflows are stale for this gojira.yaml (contract $actual, manifests rendered from $GOJIRA_CONTRACT). Merge Gojira's setup PR, or press Provision again, then redeploy."
            exit 1
          fi

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/123456789/locations/global/workloadIdentityPools/gojira/providers/github
          service_account: clips-worker-deploy@example-project.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image
        # AR_TOKEN: see ci.yaml — private AR package indexes via WIF.
        run: |
          docker build --build-arg AR_TOKEN="$(gcloud auth print-access-token)" -t "$IMAGE:$GITHUB_REF_NAME" .
          docker push "$IMAGE:$GITHUB_REF_NAME"

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: qa-gke
          location: us-central1
          project_id: example-project
          use_dns_based_endpoint: true  # see gojira-ci.yaml (finding #14)

      - name: Deploy to qa
        run: |
          cd k8s/overlays/qa
          # Pin the manifest to the digest the registry holds for this tag,
          # not the tag alone: a re-run on an unchanged commit (the Redeploy
          # button) rebuilds under the SAME tag, so a tag-only reference makes
          # the apply a silent no-op while a different image sits in the
          # registry. The digest rolls pods exactly when the built bytes
          # changed; the tag stays in the ref for humans reading the cluster.
          DIGEST=$(gcloud artifacts docker images describe "$IMAGE:$GITHUB_REF_NAME" --format='value(image_summary.digest)')
          kustomize edit set image gojira-app="$IMAGE:$GITHUB_REF_NAME@$DIGEST"

          # Two-phase apply so the workload is not blocked by GMP's admission
          # webhook, which can be unavailable for several minutes on a cold
          # cluster (the GMP operator needs a node provisioned first).
          #
          # Phase 1 — bring the workload up. A GMP Rules rejection while the
          # operator is still cold is tolerated here and reconciled in phase 2;
          # any other error still fails the deploy after the retries.
          ok=false
          for attempt in $(seq 1 20); do
            rc=0; out=$(kubectl apply -k . 2>&1) || rc=$?  # || so bash -e can't kill the retry loop
            echo "$out"
            [ "$rc" -eq 0 ] && { ok=true; break; }
            if echo "$out" | grep -q 'gmp-operator'; then
              echo "GMP operator still cold — workload applied, will reconcile Rules"
              ok=true; break
            fi
            echo "apply attempt $attempt failed; waiting for cluster to settle..."
            sleep 30
          done
          [ "$ok" = true ] || { echo "deploy failed after retries"; exit 1; }
          kubectl -n clips rollout status deployment/clips-worker --timeout=600s

          # Phase 2 — reconcile the GMP Rules CR now the operator's webhook is up.
          ok=false
          for attempt in $(seq 1 20); do
            if kubectl apply -k .; then ok=true; break; fi
            echo "Rules apply attempt $attempt failed; waiting for gmp-operator..."
            sleep 30
          done
          [ "$ok" = true ] || { echo "GMP Rules failed to apply after retries"; exit 1; }

  deploy-prod:
    needs: deploy-qa
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE: us-central1-docker.pkg.dev/example-project/apps/clips-worker
    steps:
      - uses: actions/checkout@v4

      - name: Verify manifests match gojira.yaml
        # gojira.yaml and the manifests it implies can land in two commits
        # (a contract push, then Gojira's setup PR). Deploying the first
        # one ships a new image against stale manifests (finding #20:
        # clio's slack transport with no slack secret, ten minutes of
        # crashloop). GOJIRA_CONTRACT is the fingerprint of the contract
        # these manifests were rendered from — same canonical hash as
        # gojira.generator.contract_fingerprint. Fail here, before a build.
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install -q pyyaml
          actual=$(python3 -c 'import hashlib, json, yaml; doc = yaml.safe_load(open("gojira.yaml")); print(hashlib.sha256(json.dumps(doc, sort_keys=True, separators=(",", ":"), default=str).encode()).hexdigest())')
          if [ "$actual" != "$GOJIRA_CONTRACT" ]; then
            echo "::error::k8s/ and workflows are stale for this gojira.yaml (contract $actual, manifests rendered from $GOJIRA_CONTRACT). Merge Gojira's setup PR, or press Provision again, then redeploy."
            exit 1
          fi

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/123456789/locations/global/workloadIdentityPools/gojira/providers/github
          service_account: clips-worker-deploy@example-project.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # prod shares qa's registry — the tested image is
      # already present, so there is nothing to copy. Deploy it as-is.

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: prod-gke
          location: us-central1
          project_id: example-project
          use_dns_based_endpoint: true  # see gojira-ci.yaml (finding #14)

      - name: Deploy to prod
        run: |
          cd k8s/overlays/prod
          # Pin the manifest to the digest the registry holds for this tag,
          # not the tag alone: a re-run on an unchanged commit (the Redeploy
          # button) rebuilds under the SAME tag, so a tag-only reference makes
          # the apply a silent no-op while a different image sits in the
          # registry. The digest rolls pods exactly when the built bytes
          # changed; the tag stays in the ref for humans reading the cluster.
          DIGEST=$(gcloud artifacts docker images describe "$IMAGE:$GITHUB_REF_NAME" --format='value(image_summary.digest)')
          kustomize edit set image gojira-app="$IMAGE:$GITHUB_REF_NAME@$DIGEST"

          # Two-phase apply so the workload is not blocked by GMP's admission
          # webhook, which can be unavailable for several minutes on a cold
          # cluster (the GMP operator needs a node provisioned first).
          #
          # Phase 1 — bring the workload up. A GMP Rules rejection while the
          # operator is still cold is tolerated here and reconciled in phase 2;
          # any other error still fails the deploy after the retries.
          ok=false
          for attempt in $(seq 1 20); do
            rc=0; out=$(kubectl apply -k . 2>&1) || rc=$?  # || so bash -e can't kill the retry loop
            echo "$out"
            [ "$rc" -eq 0 ] && { ok=true; break; }
            if echo "$out" | grep -q 'gmp-operator'; then
              echo "GMP operator still cold — workload applied, will reconcile Rules"
              ok=true; break
            fi
            echo "apply attempt $attempt failed; waiting for cluster to settle..."
            sleep 30
          done
          [ "$ok" = true ] || { echo "deploy failed after retries"; exit 1; }
          kubectl -n clips rollout status deployment/clips-worker --timeout=600s

          # Phase 2 — reconcile the GMP Rules CR now the operator's webhook is up.
          ok=false
          for attempt in $(seq 1 20); do
            if kubectl apply -k .; then ok=true; break; fi
            echo "Rules apply attempt $attempt failed; waiting for gmp-operator..."
            sleep 30
          done
          [ "$ok" = true ] || { echo "GMP Rules failed to apply after retries"; exit 1; }

