# Generated by Gojira. Edits will be overwritten on regeneration —
# change gojira.yaml instead.
name: Gojira CI

on:
  push:
    branches: [main]
  workflow_dispatch: {}  # Gojira's Redeploy button

permissions:
  contents: read
  id-token: write

env:
  IMAGE: us-central1-docker.pkg.dev/example-project/apps/clips-worker

jobs:
  build-and-deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/123456789/locations/global/workloadIdentityPools/gojira/providers/github
          service_account: clips-worker-deploy@example-project.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image
        # AR_TOKEN lets a Dockerfile resolve private Artifact Registry package
        # indexes (pip --extra-index-url, npm) with this workflow's own WIF
        # identity. Dockerfiles that declare no such ARG ignore it.
        run: |
          TAG="${GITHUB_SHA::12}"
          docker build --build-arg AR_TOKEN="$(gcloud auth print-access-token)" -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: dev-gke
          location: us-central1
          project_id: example-project
          # IAM-authenticated DNS endpoint: works for private control planes
          # (GitHub runners can't reach a private IP) and public ones alike.
          # The provisioner ensures DNS access is enabled on every registered
          # cluster (finding #14).
          use_dns_based_endpoint: true

      - name: Deploy to dev
        run: |
          cd k8s/overlays/dev
          kustomize edit set image gojira-app="$IMAGE:${GITHUB_SHA::12}"

          # Two-phase apply so the workload is not blocked by GMP's admission
          # webhook, which can be unavailable for several minutes on a cold
          # cluster (the GMP operator needs a node provisioned first).
          #
          # Phase 1 — bring the workload up. A GMP Rules rejection while the
          # operator is still cold is tolerated here and reconciled in phase 2;
          # any other error still fails the deploy after the retries.
          ok=false
          for attempt in $(seq 1 20); do
            rc=0; out=$(kubectl apply -k . 2>&1) || rc=$?  # || so bash -e can't kill the retry loop
            echo "$out"
            [ "$rc" -eq 0 ] && { ok=true; break; }
            if echo "$out" | grep -q 'gmp-operator'; then
              echo "GMP operator still cold — workload applied, will reconcile Rules"
              ok=true; break
            fi
            echo "apply attempt $attempt failed; waiting for cluster to settle..."
            sleep 30
          done
          [ "$ok" = true ] || { echo "deploy failed after retries"; exit 1; }
          kubectl -n clips rollout status deployment/clips-worker --timeout=600s

          # Phase 2 — reconcile the GMP Rules CR now the operator's webhook is up.
          ok=false
          for attempt in $(seq 1 20); do
            if kubectl apply -k .; then ok=true; break; fi
            echo "Rules apply attempt $attempt failed; waiting for gmp-operator..."
            sleep 30
          done
          [ "$ok" = true ] || { echo "GMP Rules failed to apply after retries"; exit 1; }

