# Generated by Gojira. Edits will be overwritten on regeneration —
# change gojira.yaml instead.
#
# Flow: push a v* tag → each downstream env is promoted in order. Build-from-
# scratch envs (e.g. qa) build and push their own image; the final env (prod)
# crane-copies the exact image its predecessor built and tested — no rebuild —
# then deploys. Prod waits on the "production" GitHub environment's protection
# rule (required reviewers) — approve in the Actions run.
name: Gojira Promote

on:
  push:
    tags: ['v*']

concurrency:
  group: gojira-deploy-${{ github.repository }}-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GOJIRA_CONTRACT: 4cc3916a9b5a7c0e5b0442e5df84e8814214cc63a60e2736fc615bdc7674ff9f

jobs:
  deploy-qa:
    # The repository variable GOJIRA_CI_RUNNER names a self-hosted runner label; unset, GitHub's.
    runs-on: ${{ vars.GOJIRA_CI_RUNNER || 'ubuntu-latest' }}
    env:
      IMAGE: ${{ vars.GOJIRA_QA_AR_REPO }}/clips-sweeper
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Platform variables for qa
        # Gojira set these on the repository when it connected it (and sets
        # them again on every Provision). Registry, deploy identity and
        # cluster are the install's facts, so they live there and not here:
        # this file is the same under any Gojira. Unset means this repo is
        # not connected to the Gojira whose workflow is running.
        env:
          GOJIRA_QA_AR_REPO: ${{ vars.GOJIRA_QA_AR_REPO }}
          GOJIRA_QA_WIF_PROVIDER: ${{ vars.GOJIRA_QA_WIF_PROVIDER }}
          GOJIRA_QA_DEPLOY_SA: ${{ vars.GOJIRA_QA_DEPLOY_SA }}
          GOJIRA_QA_PROJECT: ${{ vars.GOJIRA_QA_PROJECT }}
          GOJIRA_QA_LOCATION: ${{ vars.GOJIRA_QA_LOCATION }}
          GOJIRA_QA_GKE_CLUSTER: ${{ vars.GOJIRA_QA_GKE_CLUSTER }}
        run: |
          for name in GOJIRA_QA_AR_REPO GOJIRA_QA_WIF_PROVIDER GOJIRA_QA_DEPLOY_SA GOJIRA_QA_PROJECT GOJIRA_QA_LOCATION GOJIRA_QA_GKE_CLUSTER; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set on this repository — it is not connected to a Gojira that set it. Connect the repo there, or press Provision again."
              exit 1
            fi
          done

      - name: Verify manifests match gojira.yaml
        # gojira.yaml and the manifests it implies can land in two commits
        # (a contract push, then Gojira's setup PR). Deploying the first
        # one ships a new image against stale manifests (finding #20:
        # clio's slack transport with no slack secret, ten minutes of
        # crashloop). GOJIRA_CONTRACT is the fingerprint of the contract
        # these manifests were rendered from — same canonical hash as
        # gojira.generator.contract_fingerprint. Fail here, before a build.
        run: |
          # A bare self-hosted runner (GitHub's actions-runner image) has python3
          # without pip; its sudo is passwordless, so the distro package does.
          python3 -c 'import yaml' 2>/dev/null \
            || python3 -m pip install -q pyyaml 2>/dev/null \
            || { sudo apt-get -qq update && sudo apt-get -qq install -y python3-yaml >/dev/null; } \
            || { echo "::error::this runner has no python3 with PyYAML and none could be installed"; exit 1; }
          actual=$(python3 -c 'import hashlib, json, yaml; doc = yaml.safe_load(open("gojira.yaml")); print(hashlib.sha256(json.dumps(doc, sort_keys=True, separators=(",", ":"), default=str).encode()).hexdigest())')
          if [ "$actual" != "$GOJIRA_CONTRACT" ]; then
            echo "::error::k8s/ and workflows are stale for this gojira.yaml (contract $actual, manifests rendered from $GOJIRA_CONTRACT). Merge Gojira's setup PR, or press Provision again, then redeploy."
            exit 1
          fi

      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GOJIRA_QA_WIF_PROVIDER }}
          service_account: ${{ vars.GOJIRA_QA_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f  # v2.2.1

      - name: Tools the runner may lack
        # GitHub's hosted runners carry all of these. A self-hosted runner
        # needs docker (for apps built from their repo) and nothing else:
        # what is missing is fetched here, pinned. kubectl comes from the
        # gcloud setup-gcloud just installed; kustomize is not a gcloud
        # component, so its release tarball is fetched and checked against
        # the sha256 kustomize publishes. The GKE auth plugin is not needed:
        # get-gke-credentials writes the auth step's token into kubeconfig.
        run: |
          command -v kubectl >/dev/null || gcloud components install kubectl --quiet
          if ! command -v kustomize >/dev/null; then
            case "$(uname -m)" in
              x86_64) arch=amd64; sum=cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61 ;;
              aarch64|arm64) arch=arm64; sum=9867b76482cfc6d25b546abc1d2b5a32bd137505aba640649b4b378f64f6d68f ;;
              *) echo "::error::no kustomize build for $(uname -m)"; exit 1 ;;
            esac
            curl -fsSLo kustomize.tgz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.3/kustomize_v5.8.3_linux_${arch}.tar.gz"
            echo "$sum  kustomize.tgz" | sha256sum -c - >/dev/null
            tar -xzf kustomize.tgz kustomize && rm kustomize.tgz
            mkdir -p "$HOME/.local/bin" && mv kustomize "$HOME/.local/bin/kustomize"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker "${IMAGE%%/*}" --quiet

      - name: Build and push image
        # AR_TOKEN: see ci.yaml — a BuildKit secret, never a build arg.
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          AR_TOKEN="$(gcloud auth print-access-token)"
          export AR_TOKEN
          docker build --secret id=ar_token,env=AR_TOKEN -t "$IMAGE:$GITHUB_REF_NAME" .
          docker push "$IMAGE:$GITHUB_REF_NAME"

      - uses: google-github-actions/get-gke-credentials@64bc7249bbcf78056bb92f14d3cedc2da193946c  # v2.3.5
        with:
          cluster_name: ${{ vars.GOJIRA_QA_GKE_CLUSTER }}
          location: ${{ vars.GOJIRA_QA_LOCATION }}
          project_id: ${{ vars.GOJIRA_QA_PROJECT }}
          use_dns_based_endpoint: true  # see gojira-ci.yaml (finding #14)

      - name: Deploy to qa
        run: |
          cd k8s/overlays/qa
          # Pin the manifest to the digest the registry holds for this tag,
          # not the tag alone: a re-run on an unchanged commit (the Redeploy
          # button) rebuilds under the SAME tag, so a tag-only reference makes
          # the apply a silent no-op while a different image sits in the
          # registry. The digest rolls pods exactly when the built bytes
          # changed; the tag stays in the ref for humans reading the cluster.
          # tags list, not images describe: describe also queries Container
          # Analysis (containeranalysis.occurrences.list), which no AR role
          # grants — it works here only while the runner's gcloud happens not
          # to make that call. tags list answers from AR alone.
          DIGEST=$(gcloud artifacts docker tags list "$IMAGE" --filter="tag:$GITHUB_REF_NAME" --format='value(version)')
          kustomize edit set image gojira-app="$IMAGE:$GITHUB_REF_NAME@$DIGEST"

          # Retry the apply: a cold cluster may have no nodes yet. A genuine
          # error still fails after the retries.
          # A manifest that does not build is a deterministic error, not a cold
          # cluster: it fails here, once, with kustomize's message. The retries
          # below are for the cluster.
          kubectl kustomize . > /dev/null
          ok=false
          for attempt in $(seq 1 20); do
            rc=0; out=$(kubectl apply -k . 2>&1) || rc=$?  # || so bash -e can't kill the retry loop
            echo "$out"
            [ "$rc" -eq 0 ] && { ok=true; break; }
            echo "apply attempt $attempt failed; waiting for cluster to settle..."
            sleep 30
          done
          [ "$ok" = true ] || { echo "deploy failed after retries"; exit 1; }

  deploy-prod:
    needs: deploy-qa
    # The repository variable GOJIRA_CI_RUNNER names a self-hosted runner label; unset, GitHub's.
    runs-on: ${{ vars.GOJIRA_CI_RUNNER || 'ubuntu-latest' }}
    environment: production
    env:
      IMAGE: ${{ vars.GOJIRA_PROD_AR_REPO }}/clips-sweeper
      SOURCE_IMAGE: ${{ vars.GOJIRA_QA_AR_REPO }}/clips-sweeper
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Platform variables for prod
        # Gojira set these on the repository when it connected it (and sets
        # them again on every Provision). Registry, deploy identity and
        # cluster are the install's facts, so they live there and not here:
        # this file is the same under any Gojira. Unset means this repo is
        # not connected to the Gojira whose workflow is running.
        env:
          GOJIRA_PROD_AR_REPO: ${{ vars.GOJIRA_PROD_AR_REPO }}
          GOJIRA_PROD_WIF_PROVIDER: ${{ vars.GOJIRA_PROD_WIF_PROVIDER }}
          GOJIRA_PROD_DEPLOY_SA: ${{ vars.GOJIRA_PROD_DEPLOY_SA }}
          GOJIRA_PROD_PROJECT: ${{ vars.GOJIRA_PROD_PROJECT }}
          GOJIRA_PROD_LOCATION: ${{ vars.GOJIRA_PROD_LOCATION }}
          GOJIRA_PROD_GKE_CLUSTER: ${{ vars.GOJIRA_PROD_GKE_CLUSTER }}
        run: |
          for name in GOJIRA_PROD_AR_REPO GOJIRA_PROD_WIF_PROVIDER GOJIRA_PROD_DEPLOY_SA GOJIRA_PROD_PROJECT GOJIRA_PROD_LOCATION GOJIRA_PROD_GKE_CLUSTER; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set on this repository — it is not connected to a Gojira that set it. Connect the repo there, or press Provision again."
              exit 1
            fi
          done
      - name: Platform variables for qa
        # Gojira set these on the repository when it connected it (and sets
        # them again on every Provision). Registry, deploy identity and
        # cluster are the install's facts, so they live there and not here:
        # this file is the same under any Gojira. Unset means this repo is
        # not connected to the Gojira whose workflow is running.
        env:
          GOJIRA_QA_AR_REPO: ${{ vars.GOJIRA_QA_AR_REPO }}
          GOJIRA_QA_WIF_PROVIDER: ${{ vars.GOJIRA_QA_WIF_PROVIDER }}
          GOJIRA_QA_DEPLOY_SA: ${{ vars.GOJIRA_QA_DEPLOY_SA }}
          GOJIRA_QA_PROJECT: ${{ vars.GOJIRA_QA_PROJECT }}
          GOJIRA_QA_LOCATION: ${{ vars.GOJIRA_QA_LOCATION }}
          GOJIRA_QA_GKE_CLUSTER: ${{ vars.GOJIRA_QA_GKE_CLUSTER }}
        run: |
          for name in GOJIRA_QA_AR_REPO GOJIRA_QA_WIF_PROVIDER GOJIRA_QA_DEPLOY_SA GOJIRA_QA_PROJECT GOJIRA_QA_LOCATION GOJIRA_QA_GKE_CLUSTER; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set on this repository — it is not connected to a Gojira that set it. Connect the repo there, or press Provision again."
              exit 1
            fi
          done

      - name: Verify manifests match gojira.yaml
        # gojira.yaml and the manifests it implies can land in two commits
        # (a contract push, then Gojira's setup PR). Deploying the first
        # one ships a new image against stale manifests (finding #20:
        # clio's slack transport with no slack secret, ten minutes of
        # crashloop). GOJIRA_CONTRACT is the fingerprint of the contract
        # these manifests were rendered from — same canonical hash as
        # gojira.generator.contract_fingerprint. Fail here, before a build.
        run: |
          # A bare self-hosted runner (GitHub's actions-runner image) has python3
          # without pip; its sudo is passwordless, so the distro package does.
          python3 -c 'import yaml' 2>/dev/null \
            || python3 -m pip install -q pyyaml 2>/dev/null \
            || { sudo apt-get -qq update && sudo apt-get -qq install -y python3-yaml >/dev/null; } \
            || { echo "::error::this runner has no python3 with PyYAML and none could be installed"; exit 1; }
          actual=$(python3 -c 'import hashlib, json, yaml; doc = yaml.safe_load(open("gojira.yaml")); print(hashlib.sha256(json.dumps(doc, sort_keys=True, separators=(",", ":"), default=str).encode()).hexdigest())')
          if [ "$actual" != "$GOJIRA_CONTRACT" ]; then
            echo "::error::k8s/ and workflows are stale for this gojira.yaml (contract $actual, manifests rendered from $GOJIRA_CONTRACT). Merge Gojira's setup PR, or press Provision again, then redeploy."
            exit 1
          fi

      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GOJIRA_PROD_WIF_PROVIDER }}
          service_account: ${{ vars.GOJIRA_PROD_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f  # v2.2.1

      - name: Tools the runner may lack
        # GitHub's hosted runners carry all of these. A self-hosted runner
        # needs docker (for apps built from their repo) and nothing else:
        # what is missing is fetched here, pinned. kubectl comes from the
        # gcloud setup-gcloud just installed; kustomize is not a gcloud
        # component, so its release tarball is fetched and checked against
        # the sha256 kustomize publishes. The GKE auth plugin is not needed:
        # get-gke-credentials writes the auth step's token into kubeconfig.
        run: |
          command -v kubectl >/dev/null || gcloud components install kubectl --quiet
          if ! command -v kustomize >/dev/null; then
            case "$(uname -m)" in
              x86_64) arch=amd64; sum=cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61 ;;
              aarch64|arm64) arch=arm64; sum=9867b76482cfc6d25b546abc1d2b5a32bd137505aba640649b4b378f64f6d68f ;;
              *) echo "::error::no kustomize build for $(uname -m)"; exit 1 ;;
            esac
            curl -fsSLo kustomize.tgz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.3/kustomize_v5.8.3_linux_${arch}.tar.gz"
            echo "$sum  kustomize.tgz" | sha256sum -c - >/dev/null
            tar -xzf kustomize.tgz kustomize && rm kustomize.tgz
            mkdir -p "$HOME/.local/bin" && mv kustomize "$HOME/.local/bin/kustomize"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e  # v0.4

      - name: Copy tested image from qa (no rebuild)
        # Whether the two environments share a registry is the install's
        # business, so it is decided here from the variables, not rendered.
        run: |
          if [ "$SOURCE_IMAGE" = "$IMAGE" ]; then
            echo "prod shares qa's registry — the tested image is already present"
            exit 0
          fi
          gcloud auth configure-docker "${SOURCE_IMAGE%%/*}" --quiet
          gcloud auth configure-docker "${IMAGE%%/*}" --quiet
          crane copy "$SOURCE_IMAGE:$GITHUB_REF_NAME" "$IMAGE:$GITHUB_REF_NAME"

      - uses: google-github-actions/get-gke-credentials@64bc7249bbcf78056bb92f14d3cedc2da193946c  # v2.3.5
        with:
          cluster_name: ${{ vars.GOJIRA_PROD_GKE_CLUSTER }}
          location: ${{ vars.GOJIRA_PROD_LOCATION }}
          project_id: ${{ vars.GOJIRA_PROD_PROJECT }}
          use_dns_based_endpoint: true  # see gojira-ci.yaml (finding #14)

      - name: Deploy to prod
        run: |
          cd k8s/overlays/prod
          # Pin the manifest to the digest the registry holds for this tag,
          # not the tag alone: a re-run on an unchanged commit (the Redeploy
          # button) rebuilds under the SAME tag, so a tag-only reference makes
          # the apply a silent no-op while a different image sits in the
          # registry. The digest rolls pods exactly when the built bytes
          # changed; the tag stays in the ref for humans reading the cluster.
          # tags list, not images describe: describe also queries Container
