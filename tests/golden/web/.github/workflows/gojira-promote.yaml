# Generated by Gojira. Edits will be overwritten on regeneration —
# change gojira.yaml instead.
#
# Flow: push a v* tag → the dev-built image is retagged (no rebuild) and
# deployed to qa. Prod waits on the "production" GitHub environment's
# protection rule (required reviewers) — approve in the Actions run.
name: Gojira Promote

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

env:
  IMAGE: us-central1-docker.pkg.dev/example-project/apps/clips-api

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/123456789/locations/global/workloadIdentityPools/gojira/providers/github
          service_account: clips-api-deploy@example-project.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Tag image with release version
        run: |
          gcloud artifacts docker tags add \
            "$IMAGE:${GITHUB_SHA::12}" \
            "$IMAGE:$GITHUB_REF_NAME"

  deploy-qa:
    needs: retag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/123456789/locations/global/workloadIdentityPools/gojira/providers/github
          service_account: clips-api-deploy@example-project.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: example-gke
          location: us-central1
          project_id: example-project

      - name: Deploy to qa
        run: |
          cd k8s/overlays/qa
          kustomize edit set image gojira-app="$IMAGE:$GITHUB_REF_NAME"
          # Retry: operator admission webhooks can be briefly unavailable on a
          # cold cluster. A genuine error still fails after the retries.
          ok=false
          for attempt in $(seq 1 10); do
            if kubectl apply -k .; then ok=true; break; fi
            echo "apply attempt $attempt failed; waiting for cluster to settle..."
            sleep 30
          done
          [ "$ok" = true ] || { echo "deploy failed after retries"; exit 1; }
          kubectl -n clips rollout status deployment/clips-api --timeout=300s

  deploy-prod:
    needs: deploy-qa
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/123456789/locations/global/workloadIdentityPools/gojira/providers/github
          service_account: clips-api-deploy@example-project.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: example-gke
          location: us-central1
          project_id: example-project

      - name: Deploy to prod
        run: |
          cd k8s/overlays/prod
          kustomize edit set image gojira-app="$IMAGE:$GITHUB_REF_NAME"
          # Retry: operator admission webhooks can be briefly unavailable on a
          # cold cluster. A genuine error still fails after the retries.
          ok=false
          for attempt in $(seq 1 10); do
            if kubectl apply -k .; then ok=true; break; fi
            echo "apply attempt $attempt failed; waiting for cluster to settle..."
            sleep 30
          done
          [ "$ok" = true ] || { echo "deploy failed after retries"; exit 1; }
          kubectl -n clips rollout status deployment/clips-api --timeout=300s
