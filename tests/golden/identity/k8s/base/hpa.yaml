# Generated by Gojira. Bounds come from the 'web' workload class,
# or from gojira.yaml's overrides.hpa where the app set its own.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clips-vertex
  labels:
    app.kubernetes.io/name: clips-vertex
    gojira.dev/managed: "true"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clips-vertex
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
