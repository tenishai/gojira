# Gojira app spec — this file is the contract between your repo and Gojira.
# Change the class or add overrides here; Gojira regenerates the manifests
# when this file changes.
app: clips-vertex
class: web
environments:
  - name: dev
    cluster: dev-cluster
    namespace: clips
  - name: qa
    cluster: qa-cluster
    namespace: clips
  - name: prod
    cluster: prod-cluster
    namespace: clips
identity:                     # the pod's GCP identity, made and granted by the platform
  gcp_roles:                  # project roles the pod needs; each must be on the install's allowlist
    - roles/aiplatform.user
# overrides:                  # needs a justification — see docs
#   requests: { cpu: "1", memory: 1Gi }
#   justification: "measured p99 over 14 days"
