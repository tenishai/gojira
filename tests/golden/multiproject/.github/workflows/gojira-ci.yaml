# Generated by Gojira. Edits will be overwritten on regeneration —
# change gojira.yaml instead.
name: Gojira CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  IMAGE: us-central1-docker.pkg.dev/example-project/apps/clips-api

jobs:
  build-and-deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/123456789/locations/global/workloadIdentityPools/gojira/providers/github
          service_account: clips-api-deploy@example-project.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          TAG="${GITHUB_SHA::12}"
          docker build -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: dev-gke
          location: us-central1
          project_id: example-project

      - name: Deploy to dev
        run: |
          TAG="${GITHUB_SHA::12}"
          cd k8s/overlays/dev
          kustomize edit set image gojira-app="$IMAGE:$TAG"
          # Retry: a cold cluster may have no nodes yet, so operator admission
          # webhooks (e.g. GMP, which validates the Rules resource) can be
          # briefly unavailable. A genuine error still fails after the retries.
          ok=false
          for attempt in $(seq 1 10); do
            if kubectl apply -k .; then ok=true; break; fi
            echo "apply attempt $attempt failed; waiting for cluster to settle..."
            sleep 30
          done
          [ "$ok" = true ] || { echo "deploy failed after retries"; exit 1; }
          kubectl -n clips rollout status deployment/clips-api --timeout=300s
