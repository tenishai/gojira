# Gojira app spec — this file is the contract between your repo and Gojira.
# Change the class or add overrides here; Gojira regenerates the manifests
# when this file changes.
app: clips-published
class: web
image: ghcr.io/example/clips:1.4.0   # a published image, copied into the install's registry; nothing is built here
environments:
  - name: dev
    cluster: dev-cluster
    namespace: clips
  - name: qa
    cluster: qa-cluster
    namespace: clips
  - name: prod
    cluster: prod-cluster
    namespace: clips
# overrides:                  # needs a justification — see docs
#   requests: { cpu: "1", memory: 1Gi }
#   justification: "measured p99 over 14 days"
