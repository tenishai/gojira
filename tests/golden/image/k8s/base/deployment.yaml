# Generated by Gojira. Sizing comes from the 'web' workload class —
# override in gojira.yaml with a justification, not here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clips-published
  labels:
    app.kubernetes.io/name: clips-published
    gojira.dev/managed: "true"
    gojira.dev/class: web
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: clips-published
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clips-published
        gojira.dev/managed: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
