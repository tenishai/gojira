[project]
name = "gojira"
version = "0.1.0"
description = "Opinionated GKE deploy platform. It tramples your hand-rolled YAML."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "httpx>=0.27",          # GitHub App backend REST calls
    "pyjwt[crypto]>=2.8",   # RS256 App JWT signing (pulls in cryptography)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
postgres = [
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gojira*"]

[tool.setuptools.package-data]
"gojira.opinions" = ["*.yaml"]
"gojira.generator" = ["templates/**/*.j2"]
"gojira.web" = ["templates/**/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
