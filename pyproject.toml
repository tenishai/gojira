[project]
name = "tenish-gojira"
version = "1.3.0"
description = "Opinionated GKE deploy platform. It tramples your hand-rolled YAML."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "tenish" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "httpx>=0.27",          # GitHub App backend REST calls
    "pyjwt[crypto]>=2.8",   # RS256 App JWT signing (pulls in cryptography)
    "prometheus-client>=0.20",  # RED metrics at /metrics (argus web profile contract)
    # OTLP tracing, env-gated by OTEL_EXPORTER_OTLP_ENDPOINT (gojira.web.tracing)
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
postgres = [
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gojira*"]

[tool.setuptools.package-data]
"gojira.opinions" = ["*.yaml"]
"gojira.generator" = ["templates/**/*.j2"]
"gojira.web" = ["templates/**/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit so the rule set doesn't move under us when ruff's defaults change
# (0.16 widened them and turned the repo's first CI run red). Widen on purpose.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests import `tests.fakes`; bare `pytest` (CI) does not put the repo root on
# sys.path the way `python -m pytest` (Makefile) does.
pythonpath = ["."]
