apiVersion: v1
kind: Service
metadata:
  name: gojira
  namespace: gojira
spec:
  selector:
    app.kubernetes.io/name: gojira
  ports:
    - name: http
      port: 80
      targetPort: http
  # ClusterIP: reach the UI for dogfooding via
  #   kubectl -n gojira port-forward svc/gojira 8080:80
  # No public ingress in v1 (no public GitHub webhook); auth/PR flows use the
  # GitHub App + the in-UI "check PR merge" / "Scan now" buttons.
  type: ClusterIP
