# IAP on: every human request is authenticated at the LB; Gojira trusts the
# asserted identity and enforces its allowlist (auth: block in config.yaml).
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: gojira-ui
  namespace: gojira
spec:
  # LB health checkers carry no identity either — finding #17, third layer
  # (kubelet, then Google's probers). /healthz is identity-exempt.
  healthCheck:
    requestPath: /healthz
    port: 8080
    type: HTTP
  iap:
    enabled: true
    oauthclientCredentials:
      secretName: gojira-iap-oauth
