# IAP on: every human request is authenticated at the LB; Gojira trusts the
# asserted identity and enforces its allowlist (auth: block in config.yaml).
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: gojira-ui
  namespace: gojira
spec:
  # LB health checkers carry no identity either — finding #17, third layer
  # (kubelet, then Google's probers). /healthz is identity-exempt.
  healthCheck:
    requestPath: /healthz
    port: 8080
    type: HTTP
  # Sign-in through Google's managed OAuth client: `enabled` alone, no
  # oauthclientCredentials (GKE >= 1.29.4-gke.1043000). The IAP OAuth Admin
  # API that minted a client per install shut down on 2026-03-19. Installs
  # from before then keep their own client: scripts/bootstrap.sh patches the
  # credentials back in while secret gojira-iap-oauth exists.
  iap:
    enabled: true
