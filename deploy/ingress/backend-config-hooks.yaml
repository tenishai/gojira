# No IAP: GitHub webhook deliveries can't do OAuth. Gojira verifies the
# X-Hub-Signature-256 HMAC on every delivery instead.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: gojira-hooks
  namespace: gojira
spec:
  healthCheck:  # see backend-config-ui.yaml — finding #17
    requestPath: /healthz
    port: 8080
    type: HTTP
