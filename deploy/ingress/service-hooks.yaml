# Second Service over the SAME pods, so the webhook path can ride a separate
# backend service without IAP (IAP is per-backend-service).
apiVersion: v1
kind: Service
metadata:
  name: gojira-hooks
  namespace: gojira
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "gojira-hooks"}'
spec:
  selector:
    app.kubernetes.io/name: gojira
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
