# DO NOT commit a real secret. This shows the shape only. Create the real one
# from your GitHub App credentials with kubectl (keeps the private key out of git):
#
#   kubectl -n gojira create secret generic gojira-github-app \
#     --from-literal=app_id="$GOJIRA_GITHUB_APP_ID" \
#     --from-literal=webhook_secret="$GOJIRA_WEBHOOK_SECRET" \
#     --from-literal=api_token="$GOJIRA_API_TOKEN" \
#     --from-file=private_key=./github-app.pem
#
apiVersion: v1
kind: Secret
metadata:
  name: gojira-github-app
  namespace: gojira
type: Opaque
stringData:
  app_id: "REPLACE"
  webhook_secret: "REPLACE"
  # Gates the /api/v1 onboarding API (api_connect, api_app_status) — see
  # configmap.yaml's auth.api_token. Generate a random value (e.g. `openssl
  # rand -hex 32`); whatever caller drives onboarding (the assembly room,
  # a CI job, curl) must send it back as `Authorization: Bearer <this value>`.
  api_token: "REPLACE"
  private_key: |
    -----BEGIN RSA PRIVATE KEY-----
    REPLACE
    -----END RSA PRIVATE KEY-----
