# DO NOT commit a real secret. This shows the shape only. Create the real one
# from your GitHub App credentials with kubectl (keeps the private key out of git):
#
#   kubectl -n gojira create secret generic gojira-github-app \
#     --from-literal=app_id="$GOJIRA_GITHUB_APP_ID" \
#     --from-literal=webhook_secret="$GOJIRA_WEBHOOK_SECRET" \
#     --from-file=private_key=./github-app.pem
#
apiVersion: v1
kind: Secret
metadata:
  name: gojira-github-app
  namespace: gojira
type: Opaque
stringData:
  app_id: "REPLACE"
  webhook_secret: "REPLACE"
  private_key: |
    -----BEGIN RSA PRIVATE KEY-----
    REPLACE
    -----END RSA PRIVATE KEY-----
