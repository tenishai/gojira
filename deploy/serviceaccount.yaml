apiVersion: v1
kind: ServiceAccount
metadata:
  name: gojira
  namespace: gojira
  annotations:
    # Workload Identity: this KSA impersonates Gojira's GSA. Replace with the
    # gojira_gsa_email Terraform output (or set via the kustomize replacement).
    iam.gke.io/gcp-service-account: REPLACE_GSA_EMAIL
