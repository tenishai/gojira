apiVersion: apps/v1
kind: Deployment
metadata:
  name: gojira
  namespace: gojira
  labels:
    app.kubernetes.io/name: gojira
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gojira
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gojira
    spec:
      serviceAccountName: gojira
      containers:
        - name: gojira
          image: gojira  # set by kustomize (images:) to the AR path + tag
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GOJIRA_CONFIG
              value: /config/config.yaml
            - name: GOJIRA_GITHUB_APP_ID
              valueFrom:
                secretKeyRef: { name: gojira-github-app, key: app_id }
            - name: GOJIRA_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: { name: gojira-github-app, key: webhook_secret }
          resources:
            requests: { cpu: 250m, memory: 512Mi, ephemeral-storage: 1Gi }
            limits: { cpu: "1", memory: 1Gi, ephemeral-storage: 2Gi }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: github-app, mountPath: /secrets, readOnly: true }
            - { name: data, mountPath: /data }
      volumes:
        - name: config
          configMap: { name: gojira-config }
        - name: github-app
          secret:
            secretName: gojira-github-app
            items:
              - { key: private_key, path: github-app.pem }
        - name: data
          persistentVolumeClaim: { claimName: gojira-data }
