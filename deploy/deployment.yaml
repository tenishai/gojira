apiVersion: apps/v1
kind: Deployment
metadata:
  name: gojira
  namespace: gojira
  labels:
    app.kubernetes.io/name: gojira
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the SQLite PVC is ReadWriteOnce, so a surged
  # new pod deadlocks waiting for the volume the old pod still holds.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gojira
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gojira
    spec:
      serviceAccountName: gojira
      # The Service is named "gojira", so K8s would inject the Docker-links var
      # GOJIRA_PORT=tcp://<clusterIP>:80 — clobbering the app's numeric port env.
      enableServiceLinks: false
      securityContext:
        # The image runs as non-root UID 10001; fsGroup makes kubelet chown
        # mounted volumes (the /data PVC) so SQLite can create its db file.
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: gojira
          image: gojira  # set by kustomize (images:) to the AR path + tag
          # The dev tag is mutable — without Always, a node that cached an old
          # (e.g. wrong-arch) image under the same tag will keep running it.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GOJIRA_CONFIG
              value: /config/config.yaml
            - name: GOJIRA_GITHUB_APP_ID
              valueFrom:
                secretKeyRef: { name: gojira-github-app, key: app_id }
            - name: GOJIRA_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: { name: gojira-github-app, key: webhook_secret }
          resources:
            requests: { cpu: 250m, memory: 512Mi, ephemeral-storage: 1Gi }
            limits: { cpu: "1", memory: 1Gi, ephemeral-storage: 2Gi }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: github-app, mountPath: /secrets, readOnly: true }
            - { name: data, mountPath: /data }
      volumes:
        - name: config
          configMap: { name: gojira-config }
        - name: github-app
          secret:
            secretName: gojira-github-app
            items:
              - { key: private_key, path: github-app.pem }
        - name: data
          persistentVolumeClaim: { claimName: gojira-data }
