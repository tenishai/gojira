apiVersion: v1
kind: ConfigMap
metadata:
  name: gojira-config
  namespace: gojira
data:
  config.yaml: |
    # ${VAR} values are interpolated from the pod's env at load (see config.py).
    # No default on api_token below is deliberate: an unset $GOJIRA_API_TOKEN
    # makes config load raise, so the pod fails closed at boot rather than
    # coming up with the onboarding API (/api/v1/apps, /api/v1/apps/{id})
    # open to any in-cluster pod. This is independent of auth.enabled (IAP) —
    # that gate covers the human UI, not the /api/v1/* exemption.
    # The GOJIRA_* knobs with defaults come from the gojira-install ConfigMap
    # that bootstrap.sh builds from gojira.env — nobody edits this file.
    auth:
      api_token: "${GOJIRA_API_TOKEN}"
      enabled: "${GOJIRA_AUTH_ENABLED:-false}"
      allowed_domain: "${GOJIRA_ALLOWED_DOMAIN:-}"
      allowed_emails: "${GOJIRA_ALLOWED_EMAILS:-}"
    github:
      app_id: "${GOJIRA_GITHUB_APP_ID}"
      private_key_path: /secrets/github-app.pem
      webhook_secret: "${GOJIRA_WEBHOOK_SECRET}"
    database:
      url: sqlite:////data/gojira.db
    ci:
      # A self-hosted runner label; set on every connected repo as CI_RUNNER.
      runner: "${GOJIRA_CI_RUNNER:-}"
    iam:
      # Project roles an app may ask for in gojira.yaml identity.gcp_roles
      # (comma list). Empty: no app may declare an identity.
      grantable_roles: "${GOJIRA_GRANTABLE_ROLES:-}"
    drift:
      enabled: "${GOJIRA_DRIFT_ENABLED:-true}"
      interval_seconds: 900
    defaults:
      environments: [dev, qa, prod]
      # Labels stamped on every namespace Gojira creates — secrets infra
      # (e.g. an ESO ClusterSecretStore) often gates on these. YAML flow map.
      namespace_labels: "${GOJIRA_NAMESPACE_LABELS:-}"
      # The arch apps get when their contract doesn't say (amd64 if empty),
      # and how your clusters provide it. A platform fact, never in a repo.
      arch: "${GOJIRA_DEFAULT_ARCH:-}"
      node_selector: "${GOJIRA_DEFAULT_NODE_SELECTOR:-}"
      # The cluster each environment name means here, for connect requests
      # that name none: {dev: my-cluster}
      environment_clusters: "${GOJIRA_ENVIRONMENT_CLUSTERS:-}"
    sizing:
      # Your build of github.com/tenishai/gojira-sizing-agent — set to enable
      # the Clusters-page "Deploy agent" button.
      agent_image: "${GOJIRA_SIZING_AGENT_IMAGE:-}"
    observe:
      # Born observed: each provisioned app hands its contract to an in-cluster
      # `argus observe` Job. Off until both knobs are set — the argus image
      # (digest-pinned) and the registered cluster names it may observe on.
      job_image: "${GOJIRA_OBSERVE_JOB_IMAGE:-}"
      clusters: "${GOJIRA_OBSERVE_CLUSTERS:-}"
