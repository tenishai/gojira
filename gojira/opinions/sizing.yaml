# Gojira's workload-class sizing opinions.
#
# These are the defaults Gojira bakes into generated manifests. They are
# deliberately burstable (requests < limits, ratio 1:2): production evidence
# shows Guaranteed QoS at low utilization wastes nodes. Override per-app in
# gojira.yaml with a justification.
#
# Ephemeral storage is always explicit — unset ephemeral specs are a hidden
# node-packing constraint.

ephemeral_storage:
  requests: 4Gi
  limits: 8Gi

classes:
  web:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
    hpa: { target_cpu_percent: 70, min_replicas: 2, max_replicas: 10 }
    probes:
      readiness: { type: http, path: /health }
      liveness: { type: http, path: /health }

  worker:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
    hpa: null
    probes:
      liveness: { type: tcp }

  # Policy/credential gateways (liminal-shaped): a data plane on the app
  # port plus a separable admin plane. SQLite-backed policy state means
  # exactly one replica -- no HPA, Recreate so two pods never share the
  # db file. Probes /healthz: the gateway reports per-target catalog
  # health there, so readiness degrades loudly with its upstreams.
  gateway:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
    hpa: null
    strategy: Recreate
    probes:
      readiness: { type: http, path: /healthz }
      liveness: { type: http, path: /healthz }

  # Slack-resident agents: single Socket Mode consumer per token, so
  # Recreate (no surge double-consumer) and never HPA. Sized like a small
  # worker; the rightsizing loop refines from evidence.
  agent:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
    hpa: null
    strategy: Recreate
    probes:
      # a2a transport serves /healthz on APP_PORT; an http readiness probe is
      # also what makes the generator emit a Service for this class.
      readiness: { type: http, path: /healthz }
      # http, not tcp: a hung agent keeps its socket open — a tcp check
      # passes while the agent is dead to the world. Learned live (iris,
      # 2026-07-26, as a hand-edit the regenerator later reclaimed); safe as
      # a class opinion since fubo-agent SDK ≥ 0.9.1 serves /healthz.
      liveness: { type: http, path: /healthz }

  cron:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
    hpa: null
    probes: {}

  heavy:
    requests: { cpu: "1", memory: 1Gi }
    limits: { cpu: "2", memory: 2Gi }
    hpa: { target_cpu_percent: 70, min_replicas: 2, max_replicas: 6 }
    probes:
      readiness: { type: http, path: /health }
      liveness: { type: http, path: /health }

  gpu:
    requests: { cpu: "1", memory: 4Gi, gpu: 1 }
    limits: { cpu: "2", memory: 8Gi, gpu: 1 }
    hpa: null
    probes:
      liveness: { type: http, path: /health }
