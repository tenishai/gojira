<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gojira{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    :root { --fg:#1c1c1e; --muted:#6b7280; --line:#e5e7eb; --bg:#f7f7f8; --accent:#2563eb; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
           color:var(--fg); background:var(--bg); }
    header { display:flex; align-items:center; gap:24px; padding:14px 28px;
             background:#fff; border-bottom:1px solid var(--line); }
    .brand { font-weight:700; font-size:18px; text-decoration:none; color:var(--fg); }
    nav a { margin-right:18px; text-decoration:none; color:var(--muted); }
    nav a:hover { color:var(--accent); }
    main { max-width:920px; margin:28px auto; padding:0 20px; }
    h1 { font-size:22px; margin:0 0 18px; } h2 { font-size:16px; margin:24px 0 10px; }
    table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line);
            border-radius:10px; overflow:hidden; }
    th,td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); }
    th { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); background:#fbfbfc; }
    tr:last-child td { border-bottom:none; }
    a { color:var(--accent); }
    .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:18px; }
    form.stack label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
    input,select { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font:inherit; }
    button { margin-top:16px; padding:9px 16px; border:0; border-radius:8px; background:var(--accent);
             color:#fff; font:inherit; font-weight:600; cursor:pointer; }
    .row { display:flex; gap:12px; } .row > * { flex:1; }
    .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; }
    .b-done,.b-active,.b-skipped { background:#dcfce7; color:#166534; }
    .b-running,.b-provisioning,.b-awaiting_pr { background:#dbeafe; color:#1e40af; }
    .b-failed { background:#fee2e2; color:#991b1b; }
    .b-pending { background:#f3f4f6; color:#6b7280; }
    .muted { color:var(--muted); } .err { color:#991b1b; font-size:13px; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; }
    .step { display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--line); }
    .step:last-child { border-bottom:none; }
    .step .name { flex:1; } .scope { color:var(--muted); font-size:12px; }
  </style>
</head>
<body>
  <header>
    <a href="/" class="brand">🦖 Gojira</a>
    <nav>
      <a href="/">Apps</a>
      <a href="/clusters">Clusters</a>
      <a href="/connect">Connect repo</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
