name: ci

# Every job runs on a GitHub-hosted runner. A public repo must never let a
# pull request reach a self-hosted machine (agora discussion 71, rule 4), and
# nothing here needs one: tests, kustomize and terraform validate are
# arch-neutral, and images build in Cloud Build. The `ci` job at the end is
# the one required check: it passes only when every other job passed, so a
# skipped or cancelled job can never count as green.
# tests/test_ci_workflow.py keeps both of those true.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # uv's own interpreter, never one the runner happens to carry.
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.12"
      # --locked: the versions in uv.lock, nothing newer; a lock that no longer
      # matches pyproject fails here instead of resolving silently.
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check gojira tests
      - run: uv run --no-sync pytest -q

  scripts:
    # Every script must at least parse; the deploy manifests must render.
    # The install path (bootstrap.sh + deploy/) had drifted apart unnoticed for
    # six weeks before this job existed — see tests/test_deploy_contract.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - run: for f in scripts/*.sh; do bash -n "$f"; done
      # Each architecture card pins the file it describes by blob sha; a seam
      # that changed without its card fails here (see AGENTS.md).
      - run: python3 scripts/check_arch_cards.py
      - run: kubectl kustomize deploy/ > /dev/null
      - run: kubectl kustomize deploy/ingress/ > /dev/null

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_wrapper: false
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate

  ci:
    # The summary the branch ruleset requires. `if: always()` so it reports even
    # when a job fails; the check then fails unless every result is "success".
    needs: [test, scripts, terraform]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ join(needs.*.result, ',') }}" = "success,success,success"
