name: ci

# CI_RUNNER (repo variable) names a self-hosted runner label (spark, an arm64
# box); unset, jobs fall back to GitHub-hosted ubuntu-latest. Tests, kustomize
# and terraform validate are arch-neutral; images build in Cloud Build.
#
# A pull request from a fork always runs on GitHub-hosted ubuntu-latest: a
# self-hosted runner must never run a fork's code. This is defence in depth,
# not the boundary (a fork's pull_request runs the fork's copy of this file),
# so the real control is fork-PR approval for outside collaborators.
# tests/test_ci_workflow.py keeps every job on this expression.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: rm -rf .venv && python -m venv .venv && .venv/bin/pip install -q -e ".[dev]"  # fresh per job: self-hosted workspaces persist
      - run: .venv/bin/ruff check gojira tests
      - run: .venv/bin/pytest -q

  scripts:
    # Every script must at least parse; the deploy manifests must render.
    # The install path (bootstrap.sh + deploy/) had drifted apart unnoticed for
    # six weeks before this job existed — see tests/test_deploy_contract.py.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - run: for f in scripts/*.sh; do bash -n "$f"; done
      # Each architecture card pins the file it describes by blob sha; a seam
      # that changed without its card fails here (see AGENTS.md).
      - run: python3 scripts/check_arch_cards.py
      - run: kubectl kustomize deploy/ > /dev/null
      - run: kubectl kustomize deploy/ingress/ > /dev/null

  terraform:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_wrapper: false  # the wrapper needs a `node` on PATH; self-hosted runners don't expose theirs
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate
